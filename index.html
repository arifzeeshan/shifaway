<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KMA Wellness Tourism coordinates premium medical tourism, treatment planning, travel support, and recovery stays with trusted healthcare partners in India." />
    <title>KMA Wellness Tourism | Premium Medical Tourism in India</title>
  </head>
  <body>
    <div id="root">
      <div class="min-h-screen bg-white">
        <nav class="bg-[#1a3a2a] text-white">
          <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
            <div class="flex items-center gap-2">
              <div class="rounded bg-[#c9a84c] px-2 py-1 text-lg font-bold text-[#1a3a2a]">KMA</div>
              <div class="hidden sm:block">
                <div class="text-xs font-semibold uppercase tracking-wider">Khalid Mahmood Aboushar</div>
                <div class="text-[10px] uppercase tracking-widest text-gray-300">Wellness Tourism</div>
              </div>
            </div>
            <a href="#/contact" class="rounded bg-[#c9a84c] px-5 py-2 text-xs font-bold uppercase tracking-wider text-[#1a3a2a]">Estimate Your Cost</a>
          </div>
        </nav>
        <main>
          <section class="relative flex min-h-[90vh] items-center overflow-hidden bg-[#102c20] text-white">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_75%_35%,rgba(201,168,76,0.18),transparent_32%),linear-gradient(120deg,#1a3a2a_0%,#102c20_55%,#07150f_100%)]"></div>
            <div class="absolute inset-0 opacity-30 [background-image:linear-gradient(rgba(255,255,255,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.05)_1px,transparent_1px)] [background-size:42px_42px]"></div>
            <div class="relative z-20 mx-auto max-w-7xl px-4 py-20 sm:px-6 lg:px-8">
              <div class="mb-8 inline-flex items-center gap-2 rounded-full border border-[#c9a84c]/40 bg-[#c9a84c]/20 px-4 py-1.5">
                <span class="text-xs font-semibold uppercase tracking-widest text-[#c9a84c]">The Gold Standard of Health Tourism</span>
              </div>
              <h1 class="mb-4 text-5xl font-bold leading-tight md:text-7xl">Luxury<br /><span class="italic text-[#c9a84c]">Healing</span><br />Redefined.</h1>
              <p class="mb-8 max-w-lg text-lg text-gray-300">Premier medical facilitation in Bengaluru's most prestigious hospitals, paired with opulent 5-star recovery stays.</p>
              <div class="flex flex-wrap gap-4">
                <a href="#/contact" class="inline-flex items-center gap-2 rounded bg-[#c9a84c] px-8 py-3 text-sm font-bold uppercase tracking-wider text-[#1a3a2a]">Get Your Estimate</a>
                <a href="#/contact" class="rounded border border-white/30 px-8 py-3 text-sm font-bold uppercase tracking-wider text-white">Contact Us</a>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
